[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybasinsubs"
version = "0.2.0"
description = "A sedimentary basin analysis toolkit: decompaction, backstripping (1D Airy or 2D flexure), microfossil paleowater depth, fault restoration and thermal maturity"
readme = "README-pypi.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Larry Syu-Heng Lai" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "openpyxl", "scikit-image",
                "fastapi>=0.110", "uvicorn>=0.27"]
keywords = ["backstripping", "basin analysis", "subsidence", "geohistory", "flexure", "thermal maturity", "geology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/GeoLarryLai/pyBasinSubs"
Repository = "https://github.com/GeoLarryLai/pyBasinSubs"
Issues = "https://github.com/GeoLarryLai/pyBasinSubs/issues"

[project.scripts]
pybasinsubs-app = "pybasinsubs.webapp:main"
pybasinsubs-ui = "pybasinsubs.webapp:main"          # alias kept from 0.1.x
pybasinsubs-tracer = "pybasinsubs.webapp:tracer"    # opens the fault editor page

[tool.setuptools.packages.find]
include = ["pybasinsubs*"]

[tool.setuptools.package-data]
pybasinsubs = ["example_data/README.md", "example_data/**/*.csv", "example_data/**/*.xlsx",
               "example_data/**/*.txt", "example_data/**/*.dat", "example_data/**/*.geojson",
               "example_data/**/*.json", "example_data/**/*.md"]
"pybasinsubs.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
ignore = ["E701", "E702", "E731"]
