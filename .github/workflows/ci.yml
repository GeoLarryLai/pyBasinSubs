# Written locally; not yet run (repository not pushed before 2026-10-31).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
  notebooks:
    # fast subset; notebooks 8-9 (2-D restorations) take several minutes and run in the weekly job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test,notebooks]"
      - run: >
          python -m pytest --nbmake --nbmake-timeout=600
          notebooks/pyBasinSubs_1_porosity_fit.ipynb
          notebooks/pyBasinSubs_2_paleowater_depth.ipynb
          notebooks/pyBasinSubs_4_R_parity.ipynb
          notebooks/pyBasinSubs_7_2D_flexure.ipynb
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: wheel loads example data in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v"/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v"/bin/python -c "import pybasinsubs as p, os; f = p.data_path('template','my_column_template.csv'); assert os.path.exists(f); print(p.read_column(f))"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
