# Written locally; not yet run. Full notebook execution, weekly and on demand.
name: notebooks (all)
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[test,notebooks,ui,faults]"
      - run: python -m pytest --nbmake --nbmake-timeout=1800 notebooks/
